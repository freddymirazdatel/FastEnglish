name: Build APK
on: [push, workflow_dispatch]

jobs:
  flet_build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Flet
        run: pip install flet
      - name: Build APK
        run: |
          yes | flet build apk azadtest.py
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: game-apk
          path: build/apk/*.apk
