name: Build APK
on:
  push:
    branches: [ main, ana ]
  workflow_dispatch:

jobs:
  flet_build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install Flet
        run: pip install flet
        
      - name: Build APK
        run: flet build apk --main azadtest.py
        
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: my-game-apk
          path: build/apk/*.apk
