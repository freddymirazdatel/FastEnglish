name: Build Flet APK
on:
  push:
    branches: [ main, ana ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Install Flet and Build
        run: |
          pip install flet
          flet build apk --main azadtest.py
      - name: Upload APK
        uses: actions/actions-download-artifact@v2
        with:
          name: release-apk
          path: build/apk/*.apk
